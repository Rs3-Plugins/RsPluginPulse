name: Weekly Wiki Game Updates

# Scrapes the RuneScape/OSRS wikis' Category:Game updates listings and
# upserts anything new into game_updates, so trend-chart spikes/crashes can
# be annotated with the official news post that likely caused them. Runs
# straight over SSH as a one-shot command (not via a systemd timer like the
# hourly mod.io/RuneLite ingest) since this only needs to run a couple of
# times a week -- see packages/ingest/src/run-wiki-updates.ts.
#
# Each wiki's own weekly update lands on a different day (RS3: Mondays
# ~11:00-12:00 Game Time/UTC; OSRS: Wednesdays ~11:30 UTC), so this fires
# the same afternoon as each one -- 17:00 UTC gives the wiki editors a few
# hours to publish the write-up before it's scraped. The script always
# fetches both wikis regardless of which day triggered it (upserts are
# idempotent, so re-checking the other wiki is a harmless no-op) -- that
# way a late write-up on either wiki still gets picked up on the next run
# instead of being missed until the following week.
#
# Also doubles as the special-events sync (folded in from the old, separate
# Sync Special Events workflow): packages/ingest/data/special-events.json is
# hand-edited (Leagues seasons, Fresh Start Worlds, betas, etc. -- see that
# file's README), not scraped. Editing it and pushing to main syncs it
# straight to the special_events table by scp'ing just that file onto the
# currently-active release and running the wholesale-replace ingest script
# -- no full API build/deploy needed. (The next real deploy via
# deploy-api.yml picks up the committed JSON from a fresh checkout as
# usual, so this out-of-band copy never goes stale or diverges from git.)
on:
  schedule:
    - cron: "0 17 * * 1" # Monday 17:00 UTC -- after RS3's weekly update
    - cron: "0 17 * * 3" # Wednesday 17:00 UTC -- after OSRS's weekly update
  push:
    branches: [main]
    paths:
      - "packages/ingest/data/special-events.json"
  workflow_dispatch:

concurrency:
  group: weekly-wiki-updates
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "scanning $SSH_HOST port $SSH_PORT ..."
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > /tmp/scanned 2>/tmp/scanerr || true
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          elif [ -s /tmp/scanned ]; then
            echo "::warning::SSH_KNOWN_HOSTS not set — trusting the key seen now"
            cp /tmp/scanned ~/.ssh/known_hosts
          else
            echo "::error::could not reach $SSH_HOST:$SSH_PORT to read its host key"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      # Only on the push that actually changed the file (or a manual run) --
      # the scheduled runs have nothing new to upload.
      - name: Upload special-events.json and sync
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" packages/ingest/data/special-events.json "$SSH_USER@$SSH_HOST:/tmp/special-events.json"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
            set -euo pipefail
            install -m 644 /tmp/special-events.json /srv/rspluginpulse/current/packages/ingest/data/special-events.json
            rm -f /tmp/special-events.json
            cd /srv/rspluginpulse/current
            set -a; source /srv/rspluginpulse/shared/.env; set +a
            npm run ingest:special-events -w @rspluginpulse/ingest
          EOF

      # Only on the schedule (or a manual run) -- a push that only touched
      # special-events.json has no new wiki updates to check for.
      - name: Run wiki-updates ingest on the server
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
            set -uo pipefail
            cd /srv/rspluginpulse/current
            set -a; source /srv/rspluginpulse/shared/.env; set +a
            npm run ingest:wiki-updates -w @rspluginpulse/ingest
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::wiki-updates ingest exited with status $status"
              exit 1
            fi
            echo "wiki-updates ingest completed successfully"
          EOF

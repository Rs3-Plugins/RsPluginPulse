name: Sync Special Events

# packages/ingest/data/special-events.json is hand-edited (Leagues seasons,
# Fresh Start Worlds, betas, etc. -- see that file's README), not scraped.
# Editing it and pushing to main syncs it straight to the special_events
# table by scp'ing just that file onto the currently-active release and
# running the wholesale-replace ingest script -- no full API build/deploy
# needed. (The next real deploy via deploy-api.yml picks up the committed
# JSON from a fresh checkout as usual, so this out-of-band copy never goes
# stale or diverges from git.)
on:
  push:
    branches: [main]
    paths:
      - "packages/ingest/data/special-events.json"
  workflow_dispatch:

concurrency:
  group: sync-special-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "scanning $SSH_HOST port $SSH_PORT ..."
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > /tmp/scanned 2>/tmp/scanerr || true
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          elif [ -s /tmp/scanned ]; then
            echo "::warning::SSH_KNOWN_HOSTS not set — trusting the key seen now"
            cp /tmp/scanned ~/.ssh/known_hosts
          else
            echo "::error::could not reach $SSH_HOST:$SSH_PORT to read its host key"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload special-events.json and sync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" packages/ingest/data/special-events.json "$SSH_USER@$SSH_HOST:/tmp/special-events.json"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
            set -euo pipefail
            install -m 644 /tmp/special-events.json /srv/rspluginpulse/current/packages/ingest/data/special-events.json
            rm -f /tmp/special-events.json
            cd /srv/rspluginpulse/current
            npm run ingest:special-events -w @rspluginpulse/ingest
          EOF

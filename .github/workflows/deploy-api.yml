name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'packages/db/**'
      - 'packages/api/**'
      - 'packages/ingest/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# One deploy at a time. Queue rather than cancel: a half-finished switch is
# worse than waiting.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Assemble release
        env:
          REL: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build
          # Everything needed to run `next start` plus ingest's tsx scripts:
          # root package.json/lockfile + hoisted node_modules, each
          # workspace's source, and deploy/ for release.sh/configure.sh.
          cp -r node_modules build/node_modules
          cp package.json package-lock.json build/
          mkdir -p build/packages
          cp -r packages/db build/packages/db
          cp -r packages/ingest build/packages/ingest
          mkdir -p build/packages/api
          cp -r packages/api/.next build/packages/api/.next
          cp packages/api/package.json packages/api/next.config.ts build/packages/api/
          cp -r deploy build/deploy
          echo "$REL" > build/RELEASE
          tar -C build -czf release.tar.gz .
          ls -lh release.tar.gz

      # .env.example decides which keys exist; this block supplies the values.
      # Listed one by one on purpose -- see deploy/render-env.mjs.
      - name: Render .env
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: |
          set -euo pipefail
          node deploy/render-env.mjs .env.example rendered.env
          echo "key count: $(grep -c '^[A-Za-z_][A-Za-z0-9_]*=' rendered.env)"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "scanning $SSH_HOST port $SSH_PORT ..."
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > /tmp/scanned 2>/tmp/scanerr || true
          ssh-keygen -lf /tmp/scanned 2>/dev/null || echo "  (scan returned nothing)"
          [ -s /tmp/scanerr ] && sed 's/^/  scan: /' /tmp/scanerr || true

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          elif [ -s /tmp/scanned ]; then
            echo "::warning::SSH_KNOWN_HOSTS not set — trusting the key seen now"
            cp /tmp/scanned ~/.ssh/known_hosts
          else
            echo "::error::could not reach $SSH_HOST:$SSH_PORT to read its host key"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

          if ! ssh -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 \
                 "$SSH_USER@$SSH_HOST" true; then
            echo "::error::SSH failed. If this says 'Host key verification failed',"
            echo "SSH_KNOWN_HOSTS does not match the key the host offered above."
            exit 1
          fi
          echo "SSH OK"

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REL: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p /srv/rspluginpulse/releases/$REL"
          scp -P "$SSH_PORT" release.tar.gz "$SSH_USER@$SSH_HOST:/tmp/$REL.tar.gz"
          scp -P "$SSH_PORT" rendered.env "$SSH_USER@$SSH_HOST:/tmp/$REL.env"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<EOF
            set -euo pipefail
            tar -C /srv/rspluginpulse/releases/$REL -xzf /tmp/$REL.tar.gz
            rm -f /tmp/$REL.tar.gz
            install -m 600 /tmp/$REL.env /srv/rspluginpulse/shared/.env
            rm -f /tmp/$REL.env
            chmod +x /srv/rspluginpulse/releases/$REL/deploy/*.sh
          EOF

      - name: Activate release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REL: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash /srv/rspluginpulse/releases/$REL/deploy/release.sh $REL"

      - name: Verify public endpoint
        if: ${{ vars.API_PUBLIC_URL != '' }}
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "$API_PUBLIC_URL/api/status" >/dev/null 2>&1; then
              echo "public health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "::error::public health check never passed"
          exit 1

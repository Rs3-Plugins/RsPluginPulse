name: TEMP - One-time Release Backfill

# ONE-TIME USE -- delete this file once you've run it successfully. Runs
# the full historical backfill (packages/ingest/src/backfill-releases.ts),
# not the recurring weekly one (that's weekly-release-ingest.yml, which
# stays). Manual trigger only (workflow_dispatch) -- no schedule, since this
# only needs to run once.
#
# Progress streams live in this job's log as the script runs (it already
# logs per mod.io plugin, and every 50 RuneLite plugins) -- watch the "Run
# release backfill on the server" step while it's in progress rather than
# waiting for the job to finish.
#
# Same ephemeral-token trick as weekly-release-ingest.yml: this run's own
# github.token is passed through as PLUGIN_HUB_TOKEN so the plugin-hub side
# isn't stuck at the 60/hour unauthenticated GitHub rate limit -- no secret
# needs to be set on the server for this to work.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "scanning $SSH_HOST port $SSH_PORT ..."
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > /tmp/scanned 2>/tmp/scanerr || true
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          elif [ -s /tmp/scanned ]; then
            echo "::warning::SSH_KNOWN_HOSTS not set — trusting the key seen now"
            cp /tmp/scanned ~/.ssh/known_hosts
          else
            echo "::error::could not reach $SSH_HOST:$SSH_PORT to read its host key"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run release backfill on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # -tt forces a pseudo-terminal so the remote npm/node process line-buffers
          # its stdout instead of fully buffering it -- without this, progress lines
          # can sit in a pipe buffer and only show up here in one big dump at the end.
          ssh -tt -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "PLUGIN_HUB_TOKEN='$GH_API_TOKEN' bash -s" <<'EOF'
            set -uo pipefail
            cd /srv/rspluginpulse/current
            npm run backfill:releases -w @rspluginpulse/ingest
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::release backfill exited with status $status"
              exit 1
            fi
            echo "release backfill completed successfully"
          EOF
